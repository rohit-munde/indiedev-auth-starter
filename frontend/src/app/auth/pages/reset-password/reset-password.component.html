<div class="login-container">
  
  <!-- Left Side: Interactive Illustration & Brand -->
  <div class="illustration-panel">
    <div class="illustration-content">
      
      <div class="mockup-canvas">
        <div class="mockup-frame">
          <div class="mockup-header-bar">
            <div class="mockup-bar bar-1"></div>
            <div class="mockup-bar bar-2"></div>
            <div class="mockup-bar bar-3"></div>
          </div>
          <div class="mockup-inner-card">
            <div class="inner-bar inner-1"></div>
            <div class="inner-bar inner-2"></div>
            <div class="inner-bar inner-3"></div>
            <div class="inner-button"></div>
          </div>
        </div>
      </div>
      
      <div class="brand-wrapper">
        <h1 class="brand-title">IndieDev Starter</h1>
        <p class="brand-subtitle">Modern full-stack authentication platform</p>
      </div>

    </div>
  </div>

  <!-- Right Side: Card Sheet -->
  <div class="form-panel">
    <div class="login-card">
      
      <!-- Header Branding -->
      <div class="logo-block">
        <div class="logo-badge">
          <span>I</span>
        </div>
        <span class="logo-text">IndieDev</span>
      </div>

      <!-- Greetings -->
      <div class="welcome-header">
        <h2>Set new password</h2>
        <p class="subtitle">Your new password must be different from previously used passwords.</p>
      </div>

      <!-- Form container -->
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
        
        <!-- Password Input -->
        <div class="form-group">
          <label for="password" class="input-label">New Password</label>
          <mat-form-field appearance="outline" class="custom-form-field">
            <input matInput id="password" [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••••••" autocomplete="new-password">
            <button type="button" mat-icon-button matSuffix (click)="togglePasswordVisibility($event)" [attr.aria-label]="'Toggle password visibility'" class="toggle-password-btn">
              <span class="material-symbols-outlined">
                {{ hidePassword ? 'visibility' : 'visibility_off' }}
              </span>
            </button>
            <mat-error *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
            <mat-error *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.hasError('minlength')">
              Password must be at least 6 characters long
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Confirm Password Input -->
        <div class="form-group">
          <label for="confirmPassword" class="input-label">Confirm Password</label>
          <mat-form-field appearance="outline" class="custom-form-field">
            <input matInput id="confirmPassword" [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" placeholder="••••••••••••" autocomplete="new-password">
            <button type="button" mat-icon-button matSuffix (click)="toggleConfirmPasswordVisibility($event)" [attr.aria-label]="'Toggle password visibility'" class="toggle-password-btn">
              <span class="material-symbols-outlined">
                {{ hideConfirmPassword ? 'visibility' : 'visibility_off' }}
              </span>
            </button>
            <mat-error *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched">
              Passwords do not match
            </mat-error>
          </mat-form-field>
        </div>

        <button mat-flat-button type="submit" class="submit-btn" [disabled]="resetForm.invalid">
          Reset Password
        </button>

      </form>

      <!-- Footer Options -->
      <div class="signup-redirect">
        <a [routerLink]="AppRoutes.auth.fullLogin" class="create-account-link" style="margin-top: 16px; display: inline-block;">
          &larr; Back to login
        </a>
      </div>

    </div>
  </div>

</div>
